name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # WXT, Vitest and web-ext run on Node; Bun installs and runs the scripts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep in step with packageManager in package.json.
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox

      - run: bun run typecheck

      - name: Test (lifecycle, test-page tool, and browser in Chromium and Firefox)
        run: bun run test

      - name: Build Chrome and Firefox
        run: bun run build

      - name: Lint the Firefox build
        run: bun run lint:firefox
